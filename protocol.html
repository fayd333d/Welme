/* ---------- render root ---------- */
function bindInput(id, key, filter, after){
  var el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', function(){
    var v = filter ? filter(el.value) : el.value;
    if(v !== el.value) el.value = v;
    S[key] = v; persist();
    if(after) after();
  });
}

var lastRenderedStep = null;

// Every screen routes through here. Questions render synchronously as before;
// the results page goes through renderResults(), which cannot leave the user
// with nothing on screen.
function render(){
  if(S.step === 4){ renderResults(); return; }
  try{ renderQuestions(); }
  catch(e){ paintResultsError('question_render:' + (e && e.message), e); }
}

function renderQuestions(){
  renderHeader();
  ensureQuizStarted();
  var screen = document.getElementById('screen');
  var html = '';
  if(S.step === 0) html = goalsScreen();
  else if(S.step === 1) html = aboutScreen();
  else if(S.step === 2) html = suppsScreen();
  else html = condScreen();
  html += navHtml();
  screen.innerHTML = html;
  /* replay the enter animation only when the step changes */
  if(lastRenderedStep !== S.step){
    lastRenderedStep = S.step;
    screen.style.animation = 'none';
    void screen.offsetWidth;
    screen.style.animation = '';
  }
  bindScreenInputs();
}

function bindScreenInputs(){
  bindInput('inAge', 'age', num, syncNext);
  bindInput('inWeight', 'weight', num, syncNext);
  bindInput('inHFt', 'hFt', num, syncNext);
  bindInput('inHIn', 'hIn', num, syncNext);
  bindInput('inHCm', 'hCm', num, syncNext);
  bindInput('inSuppDraft', 'suppDraft', null);
  bindInput('inCondDraft', 'condDraft', null);
  bindInput('inEmail', 'email', null, function(){
    var btn = document.getElementById('btnEmail');
    if(!btn) return;
    var ok = /.+@.+\..+/.test(S.email);
    btn.disabled = !ok;
    btn.style.background = ok ? '#14655B' : '#A9BAB3';
    // the purchase button also carries a cursor state — keep it in step
    btn.style.cursor = ok ? 'pointer' : 'not-allowed';
  });

  var suppDraft = document.getElementById('inSuppDraft');
  if(suppDraft) suppDraft.addEventListener('keydown', function(e){ if(e.key === 'Enter') addChip('customSupps','suppDraft'); });
  var condDraft = document.getElementById('inCondDraft');
  if(condDraft) condDraft.addEventListener('keydown', function(e){ if(e.key === 'Enter') addChip('customConditions','condDraft'); });
}

document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!t) return;
  var act = t.getAttribute('data-act');
  var arg = t.getAttribute('data-arg');
  // No tap may end in a dead screen: if handling one throws, the user is still
  // routed somewhere they can act from.
  try{ handleAction(act, arg, e); }
  catch(err){
    try{ console.error('Welme: action failed —', act, err); }catch(e2){}
    if(act === 'next' || S.step === 4) paintResultsError('action:' + act + ':' + (err && err.message), err);
  }
});

function handleAction(act, arg, e){
  switch(act){
    case 'toggle-goal': {
      var goalOn = S.goals.indexOf(arg) !== -1;
      if(!goalOn && S.goals.length >= MAX_GOALS) break;   // at the limit — ignore
      set({
        goals: goalOn ? S.goals.filter(function(x){ return x !== arg; }) : S.goals.concat(arg),
        clarify: goalOn ? S.clarify.filter(function(v){ return v.indexOf(arg + '::') !== 0; }) : S.clarify
      });
      break;
    }
    case 'toggle-clarify': toggleIn('clarify', arg); break;
    case 'toggle-supp': toggleIn('supps', arg); break;
    case 'toggle-customsupp': toggleIn('customSupps', arg); break;
    case 'toggle-cond': toggleIn('conditions', arg); break;
    case 'toggle-customcond': toggleIn('customConditions', arg); break;
    case 'pick-sex': set({sex: arg}); break;
    case 'set-lb': if(S.wUnit !== 'lb') toImperial(); break;
    case 'set-kg': if(S.wUnit !== 'kg') toMetric(); break;
    case 'set-ft': if(S.hUnit !== 'ft') toImperial(); break;
    case 'set-cm': if(S.hUnit !== 'cm') toMetric(); break;
    case 'add-supp': addChip('customSupps','suppDraft'); break;
    case 'add-cond': addChip('customConditions','condDraft'); break;
    case 'back':
      if(S.step > 0){ set({step: S.step - 1}); window.scrollTo(0,0); }
      break;
    case 'next':
      if(stepValid()){
        var next = S.step + 1;
        if(next === 4){ goToResults(); break; }
        set({step: next});
        window.scrollTo(0,0);
      }
      break;
    case 'retry-results': retryResults(); break;
    case 'toggle-edit-plan': set({ editPlan: !S.editPlan }); break;
    case 'remove-supp':
      /* guard as well as hide: never let the box fall below the floor.
         Counts the box (what actually ships), not the plan, which also
         holds supplements they already take. */
      if(arg && buildResults().box.length > BOX_MIN_SUPPS){
        set({ removed: (S.removed || []).concat(arg) });
      }
      break;
    case 'restore-plan': set({ removed: [] }); break;
    case 'add-to-box':
      if(arg && (S.added || []).indexOf(arg) === -1) set({ added: (S.added || []).concat(arg) });
      break;
    case 'remove-from-box':
      if(arg) set({ added: (S.added || []).filter(function(x){ return x !== arg; }) });
      break;
    case 'submit-email': submitEmail(); break;
    case 'purchase': purchaseClick(); break;
    case 'landing-click':
      e.preventDefault();
      trackLandingClickAndGo();
      break;
    case 'restart':
      set({ step:0, goals:[], clarify:[], age:'', sex:'',
        weight:'', wUnit:'lb', hUnit:'ft', hFt:'', hIn:'', hCm:'', supps:[], customSupps:[],
        suppDraft:'', conditions:[], customConditions:[], condDraft:'', removed:[], added:[], editPlan:false,
        email:'', sent:false, purchaseClicked:false,
        quizAttemptId:'', quizStartTracked:false, quizFinishTracked:false, emailSubmitTracked:false,
        protocolSeenTracked:false });
      window.scrollTo(0,0);
      break;
  }
}

/* protocol_seen — fired once when the results page has actually been read to
   the end. Scroll depth is the only signal that separates "saw the plan" from
   "landed and left", so it sits in the sheet next to the conversion events. */
(function watchProtocolSeen(){
  var check = function(){
    if(S.step !== 4 || S.protocolSeenTracked) return;
    var doc = document.documentElement;
    var atEnd = (window.pageYOffset + window.innerHeight) >= (doc.scrollHeight - 24);
    if(!atEnd) return;
    setQuiet({ protocolSeenTracked: true });
    if(trackingAvailable()){
      window.WelmeTracking.trackEvent({ page:'results', event:'protocol_seen' }, { keepalive:true });
    }
  };
  window.addEventListener('scroll', check, { passive:true });
  window.addEventListener('resize', check, { passive:true });
})();

/* ---------- boot: load the formulary data, then render ---------- */
(function boot(){
  // Paint something before the first byte of /data arrives — on a slow phone
  // this used to be a blank page for the whole load, and for anyone returning
  // to a finished quiz that blank page *was* the missing results page.
  var scr = document.getElementById('screen');
  if(scr && !scr.innerHTML){
    scr.innerHTML = S.step === 4
      ? buildingScreen()
      : interimScreen(STARTING_TITLE, STARTING_SUB);
  }
  whenFormularyReady(function(err){
    // A data-load failure and a render failure are different problems and no
    // longer share one misleading message.
    if(err){ paintDataError(err); return; }
    try{ render(); }
    catch(e){ paintResultsError('boot_render:' + (e && e.message), e); }
  });
})();
</script>
