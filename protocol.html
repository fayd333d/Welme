<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:#FFFFFF;color:#2C3230;-webkit-font-smoothing:antialiased}
  img{display:block}
  input,button{font-family:inherit}
  input:focus{outline:none}
  a{color:#14655B}
  a:hover{color:#0F544B}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes heroIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes heroSheen{0%{transform:translateX(-140%)}42%,100%{transform:translateX(320%)}}

  .page{width:100%;max-width:430px;margin:0 auto;min-height:100vh;background:#FFFFFF;position:relative;display:flex;flex-direction:column}
  .hdr{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid rgba(20,101,91,.12)}
  .hdr-row{padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
  .brand{font-family:'Domine',serif;font-weight:700;font-size:24px;letter-spacing:-.02em;color:#14655B;text-decoration:none}
  .step-note{font-size:13px;font-weight:700;color:#7A867E}
  .restart-btn{border:1.5px solid rgba(20,101,91,.25);background:#fff;color:#14655B;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:800;cursor:pointer}
  .prog-track{height:5px;background:#EDE4D2}
  .prog-fill{height:100%;background:#14655B;transition:width .4s cubic-bezier(.2,.8,.2,1)}

  .screen{display:flex;flex-direction:column;flex:1;animation:fadeUp .4s ease both}
  .eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;color:#A98E4E}
  .q-title{font-family:'Domine',serif;font-weight:700;font-size:27px;line-height:1.12;margin:10px 0 6px;color:#1E3B34}
  .q-sub{margin:0;font-size:15px;line-height:1.5;color:#4A574F}

  .goal-btn{position:relative;display:flex;flex-direction:column;gap:11px;text-align:left;border-radius:18px;padding:16px 14px;cursor:pointer;transition:all .15s}
  .goal-icon{width:40px;height:40px;flex:none;border-radius:12px;background:#EAF3EE;display:flex;align-items:center;justify-content:center;color:#14655B}
  .goal-name{font-size:15px;font-weight:800;color:#1E3B34;line-height:1.2}
  .goal-check{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800}

  .chip{border-radius:999px;padding:10px 15px;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s}
  .chip.off{border:1.5px solid rgba(20,101,91,.2);background:#fff;color:#33403A}
  .chip.on{border:1.5px solid #14655B;background:#14655B;color:#fff}

  .field-label{font-size:12px;font-weight:800;letter-spacing:.12em;color:#7A867E;margin-bottom:9px}
  .num-box{display:flex;align-items:baseline;gap:10px;background:#fff;border:1.5px solid rgba(20,101,91,.18);border-radius:16px;padding:14px 18px;cursor:text}
  .num-box:focus-within{border-color:#14655B}
  .num-box input{flex:1;min-width:0;border:none;background:transparent;font-family:'Domine',serif;font-size:30px;font-weight:700;color:#1E3B34;line-height:1;caret-color:#14655B}
  .num-unit{flex:none;font-size:12px;font-weight:800;letter-spacing:.12em;color:#A98E4E}
  .seg-btn{border-radius:14px;padding:13px 8px;font-size:14px;font-weight:800;cursor:pointer;transition:all .15s;flex:1}

  .unit-btn{border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:800;cursor:pointer}

  .add-row{display:flex;gap:8px;margin-top:16px}
  .add-row input{flex:1;border:1.5px solid rgba(20,101,91,.2);border-radius:14px;padding:13px 16px;font-size:15px;background:#fff;color:#1E3B34}
  .add-row input:focus{border-color:#14655B}
  .add-row button{border:none;background:#14655B;color:#fff;border-radius:14px;padding:0 20px;font-size:15px;font-weight:800;cursor:pointer}

  .nav{padding:26px 22px 40px;margin-top:auto}
  .nav-row{display:flex;gap:10px}
  .back-btn{border:1.5px solid rgba(20,101,91,.25);background:#fff;color:#14655B;border-radius:14px;padding:16px 20px;font-size:16px;font-weight:800;cursor:pointer}
  .next-btn{flex:1;border:none;color:#fff;border-radius:14px;padding:16px 20px;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 12px 26px -12px rgba(20,101,91,.55)}

  .sec-head{display:flex;align-items:center;gap:9px;margin-top:28px}
  .sec-dot{width:8px;height:8px;flex:none;border-radius:50%;background:#14655B}
  .sec-head h3{font-family:'Hanken Grotesk',sans-serif;font-weight:800;font-size:19px;margin:0;color:#1E3B34}
  .sum-chip{background:#EAF3EE;color:#14655B;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;white-space:nowrap}
  .metric-card{background:#FFFDF8;border:1px solid rgba(20,101,91,.12);border-radius:16px;padding:14px 12px}
  .metric-num{font-family:'Domine',serif;font-weight:700;font-size:24px;color:#14655B}
  .metric-lbl{font-size:12px;color:#7A867E;margin-top:2px}
  .rec-card{background:#FFFDF8;border:1px solid rgba(20,101,91,.12);border-radius:16px;padding:16px 18px}
  .rec-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .rec-name{font-size:15.5px;font-weight:800;color:#1E3B34}
  .rec-time{flex:none;font-size:11px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 10px}
  .rec-reason{margin:6px 0 0;font-size:14px;line-height:1.55;color:#4A574F}
  .plan-item{display:flex;align-items:center;gap:7px}
  .plan-dot{width:5px;height:5px;flex:none;border-radius:50%;background:#14655B}
  .plan-name{font-size:13.5px;font-weight:600;color:#33403A;line-height:1.3}
  .plan-new{flex:none;font-size:9px;font-weight:800;letter-spacing:.06em;color:#8A6D1F;background:#EBDCB2;border-radius:999px;padding:2px 6px}
  .how-step{display:flex;gap:12px;align-items:flex-start}
  .how-num{flex:none;width:26px;height:26px;border-radius:50%;background:#C9A542;color:#1E3B34;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
  .how-step p{margin:0;font-size:14.5px;line-height:1.5;color:#E8EFE9}
</style>

<script>
'use strict';

/* ---------- Google Sheets event capture lives in welme-tracking.js ---------- */

/* ---------- content ---------- */
var GOALS = [
  { id:'sleep', title:'Sleep quality', paths:['M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z'] },
  { id:'energy', title:'Energy & vitality', paths:['M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14Z'] },
  { id:'heart', title:'Heart health', paths:['M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z'] },
  { id:'brain', title:'Brain & memory', paths:['M12 5a3 3 0 1 0-5.997.142 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z','M12 5a3 3 0 1 1 5.997.142 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z','M12 5v13'] },
  { id:'joints', title:'Joints & mobility', paths:['M22 12h-4l-3 9L9 3l-3 9H2'] },
  { id:'longevity', title:'Longevity', paths:['M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10Z','M2 21c0-3 1.9-5.4 5.1-6'] },
  { id:'digestion', title:'Digestion & gut', paths:['M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5S12.5 5.5 12 3c-.5 2.5-2 4.9-4 6.5S5 13 5 15a7 7 0 0 0 7 7Z'] },
  { id:'stress', title:'Stress & mood', paths:['M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2','M9.6 4.6A2 2 0 1 1 11 8H2','M12.6 19.4A2 2 0 1 0 14 16H2'] }
];

// Sub-complaints come from data/complaint_advice.json (3 per goal). They drive
// the advice section only — never the box. Populated by applyFormularyData().
var CLAR = {};

// Step 3 lists ONLY substances that overlap our shelf or carry a real
// interaction/contraindication with it (source: Restrictions sheet). General
// dietary supplements are left out — our boxes are fixed, predefined protocols.
// Shelf items a user may already take are built from data/ingredients.json at load
// (see applyFormularyData) so the engine can keep any of the 15 in the box.
// The entries below are substances that are NOT on our shelf but still interact —
// they are flagged only and never deduped.
var SHELF_SUBS = [];
var RESTRICTED_SUBS = [
  {label:'Cod liver oil', note:'Holds both omega-3 and vitamin D — combining can push both doses high.'},
  {label:'Krill oil', note:'Another omega-3 source — avoid stacking to limit bleeding risk.'},
  {label:'Vitamin K2', note:'Vitamin K can interact with blood thinners — mention it to your pharmacist.'},
  {label:'Vitamin E', note:'High-dose vitamin E adds to the bleeding risk of omega-3.'},
  {label:'Iron', note:'Iron can bind curcumin and reduce absorption — take them a couple of hours apart.'},
  {label:'Ginkgo', note:'Ginkgo adds to bleeding risk alongside omega-3 and blood thinners.'},
  {label:'Berberine', note:'Berberine lowers blood sugar — watch for additive effects with glucose-lowering medication.'},
  {label:'Green tea extract', note:'High-dose green tea extract can stress the liver — keep intake moderate.'},
  {label:'Melatonin', note:'Melatonin adds to the calming effect of magnesium, L-theanine and ashwagandha.'}
];
// Medications worth accounting for when preparing the course (source: Restrictions sheet).
var RESTRICTED_MEDS = [
  {label:'Antidepressants', note:'SSRIs/SNRIs can interact with calming actives (L-theanine, ashwagandha) — worth a pharmacist review, and don’t add St John’s Wort or 5-HTP alongside them.'},
  {label:'Blood thinners / anticoagulants', note:'Omega-3, curcumin and ginkgo add to bleeding risk — omega-3 is capped and curcumin flagged for review.'},
  {label:'Thyroid medication', note:'We space vitamin D and magnesium ~4h from your thyroid tablet, and flag ashwagandha, which can shift thyroid hormone.'},
  {label:'Blood-pressure medication', note:'Magnesium, taurine, CoQ10 and L-theanine can gently lower blood pressure — a helpful direction, but worth monitoring.'},
  {label:'Diabetes / blood-sugar medication', note:'Ashwagandha, curcumin and CoQ10 can lower blood sugar — watch for additive effects and check with your clinician.'},
  {label:'Sedatives / sleep medication', note:'L-theanine, magnesium and ashwagandha add to a calming effect — start low if you already take a sedative or sleep aid.'},
  {label:'Levodopa (Parkinson’s)', note:'High-dose B6 and citicoline can affect levodopa — we keep B6 at label dose and flag citicoline for your neurologist.'}
];
var SUPPS = [];   // rebuilt in applyFormularyData(): shelf items + the non-shelf list above
var MEDS  = RESTRICTED_MEDS.map(function(x){ return x.label; });
var SUB_NOTE = {};        // label -> interaction note (flag-only substances)
var SUPP_ID_OF = {};      // label -> ingredient id, for the dedupe step
RESTRICTED_SUBS.forEach(function(x){ SUB_NOTE[x.label] = x.note; });
RESTRICTED_MEDS.forEach(function(x){ SUB_NOTE[x.label] = x.note; });

// Health conditions come from data/conditions.json. Populated by applyFormularyData().
var CONDS = [];

var PROTOCOL = {
  sleep:{title:'Restful Sleep',sub:'Fall asleep faster and wake up rested'},
  energy:{title:'Energy & Vitality',sub:'Beat fatigue and feel sharper through the day'},
  heart:{title:'Heart Health',sub:'Support healthy blood pressure and cholesterol'},
  brain:{title:'Brain & Focus',sub:'Clarity, memory and long-term brain support'},
  joints:{title:'Joints & Mobility',sub:'Move comfortably and protect your cartilage'},
  longevity:{title:'Longevity',sub:'Cellular health and long-term resilience'},
  digestion:{title:'Digestion & Gut',sub:'Ease bloating and support healthy digestion'},
  stress:{title:'Calm & Resilience',sub:'Steadier mood and better stress recovery'}
};

// The supplement layer (ingredients, doses, protocols, condition rules,
// substitutions, viability, age tuning) now lives in /data/*.json and is
// resolved by engine.js. Nothing about the formulary is hardcoded here.

var SUGG = {
  sleep:{text:'Magnesium and L-theanine in the evening are studied for a calmer wind-down and easier sleep onset.',hack:'Keep the bedroom cool (18–19°C / 65°F) and stop screens 45 minutes before bed – light and temperature are the two biggest sleep levers.'},
  energy:{text:'CoQ10 and B-vitamins are linked to reduced fatigue, especially past 40 when natural CoQ10 production declines.',hack:'Get 10 minutes of daylight within an hour of waking and keep caffeine before noon – both measurably improve daytime energy.'},
  heart:{text:'Omega-3 (EPA/DHA) has some of the strongest evidence in nutrition for triglyceride and blood-pressure support.',hack:'A brisk 30-minute walk five days a week lowers blood pressure about as much as some first-line medications.'},
  brain:{text:'DHA and B12 status track with cognitive performance; supplementation helps most when dietary intake is low.',hack:'Two servings of oily fish weekly plus regular aerobic exercise is the best-evidenced combo for long-term brain health.'},
  joints:{text:'Curcumin and collagen peptides show measurable reductions in joint discomfort in trials over 8–12 weeks.',hack:'Strength training twice a week protects joints better than rest – stronger muscles absorb load your joints would take.'},
  longevity:{text:'Omega-3, vitamin D and magnesium are the best-evidenced everyday nutrients tied to healthy-aging markers.',hack:'Aim for 7,000–8,000 steps a day and protein at every meal – both are strongly linked to healthspan in large studies.'},
  digestion:{text:'Probiotics and fiber support a balanced gut microbiome and more regular, comfortable digestion.',hack:'Eat 30+ different plants a week and a fermented food most days – fibre diversity is the biggest lever for gut health.'},
  stress:{text:'Ashwagandha and magnesium are studied for a calmer stress response and better recovery under load.',hack:'Try five minutes of slow breathing (4s in, 6s out) daily – it shifts your nervous system out of fight-or-flight.'}
};

var NOTE = {
  'No gallbladder':'We favour emulsified or food-based fat-soluble nutrients (D3, omega-3) that absorb well without a gallbladder.',
  'On blood thinners':'Omega-3 and vitamin E are kept at conservative doses – confirm with your doctor.',
  'Pregnant or breastfeeding':'Folate is prioritised and some herbs excluded; your doctor should confirm the final plan.',
  'Kidney disease':'Mineral doses such as magnesium are kept conservative.',
  'Acid reflux / GERD':'Gentler forms taken with food to reduce irritation.',
  'Hard to swallow pills':'Where possible we choose smaller capsules or powder-friendly forms.',
  'Thyroid condition':'Calcium and iron are separated from thyroid-medication timing.',
  'On prescription meds':'Our team checks your plan for interactions before it ships.',
  'Type 2 diabetes / prediabetes':'Blood-sugar-supporting forms are chosen and sweetened bases avoided.',
  'Liver condition':'Herbal extracts are kept conservative and reviewed by our team.',
  'IBS / sensitive gut':'A probiotic is added and doses are eased in gradually to suit a sensitive gut.',
  'Recent surgery':'Bleeding-risk actives such as omega-3 and curcumin are paused around surgery.'
};

/* ---------- formulary data (/data/*.json → engine.js) ---------- */
var FORMULARY = null;          // {ingredients, protocols, conditions, ...}
var ADVICE_BY_GOAL = {};       // goal label -> [{complaint, advice}]

function applyFormularyData(d){
  FORMULARY = d;
  WelmeEngine.init(d);

  // Sub-complaints (3 per goal) come from complaint_advice.json — single source.
  CLAR = {}; ADVICE_BY_GOAL = {};
  var labelToId = {};
  Object.keys(d.protocols).forEach(function(k){ labelToId[d.protocols[k].label] = d.protocols[k].id; });
  d.complaint_advice.forEach(function(e){
    var id = labelToId[e.goal]; if(!id) return;
    (CLAR[id] = CLAR[id] || []).push(e.complaint);
    (ADVICE_BY_GOAL[id] = ADVICE_BY_GOAL[id] || []).push({ complaint: e.complaint, advice: e.advice });
  });

  // Health conditions come from conditions.json.
  CONDS = Object.keys(d.conditions);

  // Goal limit is configured in engine_config.json.
  if(d.engine_config && d.engine_config.max_goals) MAX_GOALS = d.engine_config.max_goals;

  // "Already taking" chips: every shelf item (so it can be deduped) + the
  // non-shelf interacting substances declared above (flagged only).
  SHELF_SUBS = d.ingredients.map(function(i){ return { label: i.name, id: i.id }; });
  SUPP_ID_OF = {};
  SHELF_SUBS.forEach(function(x){ SUPP_ID_OF[x.label] = x.id; });
  SUPPS = SHELF_SUBS.map(function(x){ return x.label; })
            .concat(RESTRICTED_SUBS.map(function(x){ return x.label; }));
}

// Ingredient ids for everything the user said they already take. Shelf items
// that serve a selected goal are kept in the box by the engine (see engine.js
// step 1b); the rest are only used for interaction flagging.
function takingIds(){
  var out = [];
  (S.supps || []).forEach(function(l){
    var id = SUPP_ID_OF[l];
    if(id && out.indexOf(id) === -1) out.push(id);
  });
  return out;
}

/* Monthly price of the box, shown on the results page. Single source of
   truth — the results copy and the purchase button both read it. */
/* Box price scales with how many supplements are in the plan: $39 at the
   4-supplement floor up to $54 at 9, $3 a step. Clamped at both ends so a
   plan outside that range still prices sensibly. */
var BOX_MIN_SUPPS = 4, BOX_MAX_SUPPS = 9;
var BOX_MIN_PRICE = 39, BOX_MAX_PRICE = 54;
var BOX_PRICE_STEP = (BOX_MAX_PRICE - BOX_MIN_PRICE) / (BOX_MAX_SUPPS - BOX_MIN_SUPPS);

function boxPrice(count){
  var n = count || 0;
  if(n < BOX_MIN_SUPPS) n = BOX_MIN_SUPPS;
  if(n > BOX_MAX_SUPPS) n = BOX_MAX_SUPPS;
  return Math.round(BOX_MIN_PRICE + (n - BOX_MIN_SUPPS) * BOX_PRICE_STEP);
}

/* ---------- state ---------- */
var DEFAULT_STATE = {
  step: 0,
  goals: [], clarify: [],
  age: '', sex: '',
  weight: '', wUnit: 'lb', hUnit: 'ft', hFt: '', hIn: '', hCm: '',
  supps: [], customSupps: [], suppDraft: '',
  conditions: [], customConditions: [], condDraft: '',
  removed: [], added: [], editPlan: false,
  email: '', sent: false, purchaseClicked: false,
  quizAttemptId: '', quizStartTracked: false, quizFinishTracked: false,
  emailSubmitTracked: false, protocolSeenTracked: false
};

// Health goals a user may pick on the first question.
// Overridden from data/engine_config.json (max_goals) once the formulary loads.
var MAX_GOALS = 3;

// Saved answers may have been written by an older version of the quiz, by a
// half-finished session, or by nothing at all. Coerce every field to the shape
// the rest of this file assumes, so one bad value can never blank the results
// page. Anything unrecognisable falls back to the default rather than throwing.
var LIST_KEYS = ['goals','clarify','supps','customSupps','conditions','customConditions','removed','added'];
var TEXT_KEYS = ['age','sex','weight','hFt','hIn','hCm','email','suppDraft','condDraft','quizAttemptId'];
var FLAG_KEYS = ['sent','editPlan','purchaseClicked','quizStartTracked','quizFinishTracked',
                 'emailSubmitTracked','protocolSeenTracked'];

function normaliseState(s){
  LIST_KEYS.forEach(function(k){
    s[k] = Array.isArray(s[k])
      ? s[k].filter(function(v){ return v != null && typeof v !== 'object'; }).map(String)
      : [];
  });
  TEXT_KEYS.forEach(function(k){
    s[k] = (s[k] == null || typeof s[k] === 'object') ? '' : String(s[k]);
  });
  FLAG_KEYS.forEach(function(k){ s[k] = !!s[k]; });
  if(s.wUnit !== 'kg') s.wUnit = 'lb';
  if(s.hUnit !== 'cm') s.hUnit = 'ft';
  // Flow was renumbered (goals + specifics merged); keep any stale saved step in range.
  if(typeof s.step !== 'number' || !isFinite(s.step) || s.step < 0 || s.step > 4) s.step = 0;
  s.step = Math.floor(s.step);
  // Saved sessions from before the limit may hold more than MAX_GOALS.
  if(s.goals.length > MAX_GOALS){
    s.goals = s.goals.slice(0, MAX_GOALS);
    s.clarify = s.clarify.filter(function(v){
      return s.goals.indexOf(String(v).split('::')[0]) !== -1;
    });
  }
  // Parked on the results page with nothing answered: there is no plan to build,
  // so send them back to the first question rather than to an empty page.
  if(s.step === 4 && !s.goals.length) s.step = 0;
  return s;
}

var S = (function(){
  var saved = {};
  try{ saved = JSON.parse(localStorage.getItem('welme-ad-funnel') || '{}'); }catch(e){}
  if(!saved || typeof saved !== 'object' || Array.isArray(saved)) saved = {};
  return normaliseState(Object.assign({}, DEFAULT_STATE, saved));
})();

function persist(){
  try{ localStorage.setItem('welme-ad-funnel', JSON.stringify({
    step:S.step, goals:S.goals, clarify:S.clarify, age:S.age, sex:S.sex,
    weight:S.weight, wUnit:S.wUnit, hUnit:S.hUnit, hFt:S.hFt, hIn:S.hIn, hCm:S.hCm,
    supps:S.supps, customSupps:S.customSupps, conditions:S.conditions,
    customConditions:S.customConditions, removed:S.removed, added:S.added,
    email:S.email, sent:S.sent, purchaseClicked:S.purchaseClicked,
    quizAttemptId:S.quizAttemptId, quizStartTracked:S.quizStartTracked,
    quizFinishTracked:S.quizFinishTracked, emailSubmitTracked:S.emailSubmitTracked,
    protocolSeenTracked:S.protocolSeenTracked
  })); }catch(e){}
}

function set(patch){ Object.assign(S, patch); persist(); render(); }
function setQuiet(patch){ Object.assign(S, patch); persist(); }

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function num(v){ return v.replace(/[^0-9]/g,''); }
function ic(paths, size, sw){
  size = size || 22; sw = sw || 1.8;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round">'
    + paths.map(function(d){ return '<path d="'+d+'"/>'; }).join('') + '</svg>';
}

function bmi(){
  var kg = parseFloat(S.weight); if(!kg) return null;
  if(S.wUnit === 'lb') kg = kg * 0.4536;
  var cm = S.hUnit === 'cm' ? (parseFloat(S.hCm)||0) : ((parseFloat(S.hFt)||0)*12 + (parseFloat(S.hIn)||0))*2.54;
  if(cm < 90) return null;
  var m = cm/100;
  return kg/(m*m);
}

function stepValid(){
  var age = parseInt(S.age)||0;
  var wv = parseFloat(S.weight)||0;
  var hOk = S.hUnit === 'cm' ? (parseFloat(S.hCm)||0) >= 90 : (parseFloat(S.hFt)||0) >= 3;
  var checks = [
    S.goals.length > 0,
    (age >= 16 && age <= 110 && !!S.sex && wv > 0 && hOk),
    true, true
  ];
  return S.step < checks.length ? checks[S.step] : true;
}

function toggleIn(key, val){
  var list = S[key];
  var next = list.indexOf(val) !== -1 ? list.filter(function(x){ return x !== val; }) : list.concat(val);
  var patch = {}; patch[key] = next;
  set(patch);
}

function addChip(listKey, draftKey){
  var v = (S[draftKey]||'').trim();
  if(!v) return;
  var patch = {};
  if(S[listKey].indexOf(v) !== -1){ patch[draftKey] = ''; set(patch); return; }
  patch[listKey] = S[listKey].concat(v);
  patch[draftKey] = '';
  set(patch);
}

function createAttemptId(){
  return 'attempt_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
}

function goalTitle(id){
  var found = null;
  GOALS.forEach(function(g){ if(g.id === id) found = g; });
  return found ? found.title : id;
}

function goalColumnValue(){
  return S.goals.map(goalTitle).join(', ');
}

function clarifyLabel(value){
  var parts = String(value).split('::');
  return parts.length > 1 ? parts.slice(1).join('::') : String(value);
}

function detailsColumnValue(){
  return S.clarify.filter(function(value){
    var parts = String(value).split('::');
    return parts.length < 2 || S.goals.indexOf(parts[0]) !== -1;
  }).map(clarifyLabel).filter(Boolean).join(', ');
}

function weightColumnValue(){
  return S.weight ? S.weight + ' ' + S.wUnit : '';
}

function heightColumnValue(){
  if(S.hUnit === 'cm') return S.hCm ? S.hCm + ' cm' : '';
  var parts = [];
  if(S.hFt) parts.push(S.hFt + ' ft');
  if(S.hIn !== '') parts.push(S.hIn + ' in');
  return parts.join(' ');
}

function problemsColumnValue(){
  var problems = S.conditions.concat(S.customConditions);
  var draft = (S.condDraft || '').trim();
  if(draft && problems.indexOf(draft) === -1) problems = problems.concat(draft);
  return problems.filter(Boolean).join(', ');
}

function trackingAvailable(){
  return !!(window.WelmeTracking && window.WelmeTracking.trackEvent);
}

function ensureQuizStarted(){
  if(S.step >= 4) return;
  if(!S.quizAttemptId){
    S.quizAttemptId = createAttemptId();
    // Every "once only" flag is scoped to the attempt, not to the browser.
    // Without the last two, a second run through the funnel on the same
    // device recorded quiz_start and quiz_finish but stayed silent for
    // protocol_seen and email_submit.
    S.quizStartTracked = false;
    S.quizFinishTracked = false;
    S.protocolSeenTracked = false;
    S.emailSubmitTracked = false;
    persist();
  }
  if(!S.quizStartTracked && trackingAvailable()){
    window.WelmeTracking.trackEvent({ page:'quiz', event:'quiz_start' });
    S.quizStartTracked = true;
    persist();
  }
}

function cleanParts(parts){
  return parts.filter(function(part){ return part != null && String(part).trim() !== ''; });
}

function formatSupplementLine(item){
  return cleanParts([
    item.name,
    item.dosage,
    item.withFood ? 'with food' : '',
    item.alreadyTaking ? 'already taking' : ''
  ]).join(' — ');
}

function buildReadableResultsSummary(resultData){
  var lines = [];
  // What we would actually ship — not the whole protocol. Actives the user
  // already takes are only here if they asked for them with "Add to box".
  var boxItems = resultData.box || resultData.plan || [];

  lines.push('Daily pack:');
  if(boxItems.length){
    boxItems.forEach(function(item){ lines.push(formatSupplementLine(item)); });
  } else {
    lines.push('None');
  }

  var optional = resultData.optional || [];
  if(optional.length){
    lines.push('');
    lines.push('--- IN THE PROTOCOL, NOT IN THE BOX (already taking, not added) ---');
    optional.forEach(function(item){
      lines.push('[not in box] ' + item.name + (item.dosage ? ' — ' + item.dosage : ''));
    });
  }

  var flags = resultData.subRestrictions || [];
  if(flags.length){
    lines.push('');
    lines.push('--- NOT IN THE BOX (user already takes these — flagged only) ---');
    flags.forEach(function(f){
      lines.push('[not in box] ' + f.name + (f.duplicateOf ? ' — overlaps ' + f.duplicateOf + ' in the box' : ''));
    });
  }

  return lines.join('\n');
}

/* ---------- results instrumentation ----------
   quiz_finish used to be the last thing we ever recorded, so a user who never
   reached the plan looked exactly like a user who read it and left. These three
   close that blind spot: results_view when the plan actually paints,
   results_error when it doesn't, and the quiz_finish → results_view timing. */
var quizFinishAt = null;          // performance clock at the final tap
var resultsViewTracked = false;

function nowMs(){
  try{ return (window.performance && performance.now) ? performance.now() : Date.now(); }
  catch(e){ return Date.now(); }
}

function sinceQuizFinish(){
  return quizFinishAt == null ? '' : String(Math.round(nowMs() - quizFinishAt));
}

// The answers that produced this outcome, so a results_error can be replayed.
function withInputs(payload){
  try{
    payload.age = S.age;
    payload.gender = S.sex;
    payload.goal = goalColumnValue();
    payload.details = detailsColumnValue();
    payload.weight = weightColumnValue();
    payload.height = heightColumnValue();
    payload.problems = problemsColumnValue();
  }catch(e){}
  return payload;
}

function trackResultsView(mode){
  if(resultsViewTracked) return;
  resultsViewTracked = true;
  if(!trackingAvailable()) return;
  try{
    window.WelmeTracking.trackEvent(withInputs({
      page:'results', event:'results_view', reason: mode || '', ms: sinceQuizFinish()
    }));
  }catch(e){}
}

function trackResultsError(reason){
  if(!trackingAvailable()) return;
  try{
    window.WelmeTracking.trackEvent(withInputs({
      page:'results', event:'results_error',
      reason: String(reason == null ? 'unknown' : reason).slice(0, 300),
      ms: sinceQuizFinish()
    }));
  }catch(e){}
}

function trackQuizFinish(){
  if(S.quizFinishTracked) return;
  try{ if(window.fbq) fbq('trackCustom', 'CompleteQuiz'); }catch(e){}
  if(trackingAvailable()){
    window.WelmeTracking.trackEvent({
      page:'quiz',
      event:'quiz_finish',
      age:S.age,
      gender:S.sex,
      goal:goalColumnValue(),
      details:detailsColumnValue(),
      weight:weightColumnValue(),
      height:heightColumnValue(),
      problems:problemsColumnValue()
    });
  }
  // Pause is logged separately — a rising pause rate is a quiz-design signal,
  // not a conversion failure.
  try{
    var outcome = buildResults();
    if(trackingAvailable() && outcome.status !== 'sell'){
      window.WelmeTracking.trackEvent({
        page:'results',
        event: outcome.status === 'pause' ? 'plan_pause' : 'plan_switch',
        goal:goalColumnValue(),
        problems:problemsColumnValue(),
        reason:(outcome.deferReasons || []).map(function(d){ return d.condition; }).join(', ')
              || (outcome.deadPlans || []).join(', ')
      });
    }
  }catch(e){}
  S.quizFinishTracked = true;
  persist();
}

/* Purchase intent. There is no hand-off to the order page any more — the
   email capture takes the button's place in the card and the order details
   go out by email, so this only records the click and advances the card. */
function purchaseClick(){
  if(trackingAvailable()){
    window.WelmeTracking.trackEvent({ page:'results', event:'purchase_click' }, { keepalive:true });
  }
  try{ if(window.fbq) fbq('track', 'InitiateCheckout'); }catch(e){}
  try{ if(window.gtag) gtag('event', 'begin_checkout'); }catch(e){}
  set({ purchaseClicked: true });
}

function trackLandingClickAndGo(){
  if(trackingAvailable()){
    window.WelmeTracking.trackEvent({ page:'results', event:'landing_click' }, { keepalive:true });
  }
  window.setTimeout(function(){ window.location.href = 'home.html'; }, 0);
}

/* linked imperial/metric switch – toggling weight OR height switches BOTH systems and converts values */
function toImperial(){
  var patch = { wUnit:'lb', hUnit:'ft' };
  if(S.wUnit === 'kg'){ var kg = parseFloat(S.weight); if(kg) patch.weight = String(Math.round(kg/0.4536)); }
  if(S.hUnit === 'cm'){ var cm = parseFloat(S.hCm); if(cm){ var t = cm/2.54, f = Math.floor(t/12), i = Math.round(t - f*12); if(i === 12){ f += 1; i = 0; } patch.hFt = String(f); patch.hIn = String(i); } }
  set(patch);
}
function toMetric(){
  var patch = { wUnit:'kg', hUnit:'cm' };
  if(S.wUnit === 'lb'){ var lb = parseFloat(S.weight); if(lb) patch.weight = String(Math.round(lb*0.4536)); }
  if(S.hUnit === 'ft'){ var f = parseFloat(S.hFt)||0, i = parseFloat(S.hIn)||0; if(f || i) patch.hCm = String(Math.round((f*12 + i)*2.54)); }
  set(patch);
}

/* ---------- recommendation engine ---------- */
function buildResults(){
  var age = parseInt(S.age)||0;
  var wv = parseFloat(S.weight)||0;
  var bmiV = bmi();
  var bmiCat = bmiV == null ? '–' : bmiV < 18.5 ? 'underweight' : bmiV < 25 ? 'healthy' : bmiV < 30 ? 'elevated' : 'high';
  var heightLabel = S.hUnit === 'cm'
    ? ((parseFloat(S.hCm)||0) ? Math.round(parseFloat(S.hCm)) + ' cm' : '–')
    : ((parseFloat(S.hFt)||0) ? (parseFloat(S.hFt)||0) + '′' + (parseFloat(S.hIn)||0) + '″' : '–');
  var weightLabel = wv ? S.weight + ' ' + S.wUnit : '–';

  /* daily nutrition targets (Mifflin-St Jeor estimate) */
  var kgT = wv; if(S.wUnit === 'lb') kgT = kgT*0.4536;
  var cmT = S.hUnit === 'cm' ? (parseFloat(S.hCm)||0) : ((parseFloat(S.hFt)||0)*12 + (parseFloat(S.hIn)||0))*2.54;
  var kcal = 0, protein = 0, fat = 0, carbs = 0;
  if(kgT > 0 && cmT >= 90 && age > 0){
    var sexAdj = S.sex === 'female' ? -161 : 5;
    var bmr = 10*kgT + 6.25*cmT - 5*age + sexAdj;
    kcal = Math.round(bmr*1.4/10)*10;
    protein = Math.round(kgT*1.2);
    fat = Math.round(kcal*0.30/9);
    carbs = Math.round((kcal - protein*4 - fat*9)/4);
  }

  /* protocol identity (from primary goal) */
  var primaryGoal = S.goals[0];
  var proto = PROTOCOL[primaryGoal] || {title:'Your Protocol', sub:'A plan built around your answers'};
  var primaryG = null;
  GOALS.forEach(function(g){ if(g.id === primaryGoal) primaryG = g; });
  var protoIcon = primaryG ? ic(primaryG.paths, 116, 1.5) : '';
  var protoIconSm = primaryG ? ic(primaryG.paths, 30, 1.7) : '';
  /* selected goal names, in the order they were picked */
  var heroLines = S.goals.map(function(id){
    var found = null;
    GOALS.forEach(function(g){ if(g.id === id) found = g; });
    return found ? found.title : null;
  }).filter(Boolean);
  if(!heroLines.length) heroLines = [proto.title];
  var heroTitleHtml = heroLines.map(function(t){ return esc(t); }).join('<br>');
  /* general subtitle instead of listing every goal in the title */
  var goalCount = heroLines.length;
  var heroSubtitle = goalCount > 1
    ? 'One daily pack, built around your ' + goalCount + ' selected goals.'
    : 'One daily pack, built around your selected goal.';

  /* review copy */
  var selGoals = GOALS.filter(function(g){ return S.goals.indexOf(g.id) !== -1; });
  var goalTitlesLower = selGoals.map(function(g){ return g.title.toLowerCase(); });
  var allConds = S.conditions.concat(S.customConditions);

  var summaryChips = selGoals.map(function(g){ return g.title; });
  if(age) summaryChips.push(age + ' yrs');
  if(bmiV) summaryChips.push('BMI ' + bmiV.toFixed(1));

  /* ---- resolve the plan: engine.js + /data (single source of truth) ---- */
  var goalLabels = S.goals.map(function(id){
    var p = FORMULARY.protocols[id]; return p ? p.label : null;
  }).filter(Boolean);
  var R = WelmeEngine.resolve({
    age: age, sex: (S.sex === 'male' ? 'male' : 'female'),
    goals: goalLabels,
    conditions: allConds,
    taking: takingIds()
  });

  // What we render: name, dose exactly as in ingredients.json, what it addresses,
  // and one practical line when a PREFER_FORM / TIMING / REDUCE_DOSE rule applied.
  var plan = R.sachet.map(function(x){
    var practical = [];
    if(x.formNote)   practical.push(x.formNote);
    if(x.doseNote)   practical.push('dose ' + x.doseNote);
    if(x.timingNote) practical.push(x.timingNote);
    // Subtitle = the goals THIS user selected that this supplement serves.
    // Never substitutions.json → role: that is engine-internal and not personal.
    var matches = x.goalMatches || [];
    if(!matches.length){
      try{ console.warn('Welme: no selected-goal match for ' + x.id + ' — check upstream resolution'); }catch(e){}
    }
    return {
      id: x.id, name: x.name, dosage: x.dose, reason: matches.join(' · '),
      // what it actually does, for this user's goals only (max 2 lines per card)
      effects: (x.effects || []).slice(0, 2),
      alreadyTaking: !!x.alreadyTaking,   // they told us this one is already in their routine
      withFood: x.withFood, practical: practical.join(' · ')
    };
  });
  var removedPlan = (S.removed || []);
  plan = plan.filter(function(p){ return removedPlan.indexOf(p.name) === -1; });

  /* Plan vs box. An active they already take is shown as a card — it is part of
     their protocol — but it is NOT shipped unless they ask for it with
     "Add to box". Everything else is in the box by default. `plan` drives the
     supplement cards; `box` drives "What's inside", the count and the order. */
  var addedIds = (S.added || []);
  plan.forEach(function(p){ p.inBox = !p.alreadyTaking || addedIds.indexOf(p.id) !== -1; });
  var box = plan.filter(function(p){ return p.inBox; });
  var optional = plan.filter(function(p){ return !p.inBox; });

  /* substances they take that are NOT on our shelf but still interact — flagged
     only. Shelf items they take are handled by the engine, which keeps the ones
     that serve a selected goal in the box. */
  var subRestrictions = [];
  S.supps.forEach(function(l){
    if(SUPP_ID_OF[l]) return;                 // on our shelf → the engine decides
    if(!SUB_NOTE[l]) return;
    if(subRestrictions.some(function(x){ return x.name === l; })) return;
    subRestrictions.push({ name: l, note: SUB_NOTE[l], duplicateOf: null });
  });

  /* protocol direction (lifestyle "try this" tips per goal) */
  var directions = selGoals.map(function(g){
    var d = SUGG[g.id]; if(!d) return null;
    return { goalTitle:g.title, text:d.text, hack:d.hack, tags:[], icon:ic(g.paths, 23) };
  }).filter(Boolean);

  /* small goal symbols for the header */
  var heroSymbols = selGoals.map(function(g){ return { title:g.title, icon:ic(g.paths, 18) }; });

  /* Renderable practical notes only — never FLAG text, pharmacist markers,
     substitution reasoning or the removed list. */
  var notes = [];
  plan.forEach(function(p){ if(p.practical) notes.push(p.name + ': ' + p.practical); });

  /* advice for the sub-complaints they ticked, grouped in goal order */
  var adviceGroups = S.goals.map(function(gid){
    var proto = FORMULARY.protocols[gid]; if(!proto) return null;
    var items = (ADVICE_BY_GOAL[gid] || []).filter(function(a){
      return S.clarify.indexOf(gid + '::' + a.complaint) !== -1;
    });
    return items.length ? { goal: proto.label, items: items } : null;
  }).filter(Boolean);


  /* ---- personalised, mechanism-led explanation (physician-style, no diagnoses) ---- */
  var joinList = function(a){ a = a.filter(Boolean); if(a.length <= 1) return a[0] || ''; if(a.length === 2) return a[0] + ' and ' + a[1]; return a.slice(0,-1).join(', ') + ' and ' + a[a.length-1]; };
  var B = function(t){ return '<b style="color:#14655B">' + esc(t) + '</b>'; }; // deep-green highlight (matches border colour)
  var GOAL_AREA = { sleep:'restful sleep', energy:'daytime energy', heart:'heart health', brain:'mental clarity', joints:'joint comfort', longevity:'healthy ageing', digestion:'comfortable digestion', stress:'a calmer stress response' };

  var areasBold = selGoals.map(function(g){ return B(GOAL_AREA[g.id]); });

  /* ---- short, personalised summary (goals → body → conditions → one habit) ---- */
  var p1 = selGoals.length
    ? 'Your box targets ' + joinList(areasBold) + ' with a small set of actives chosen for how they work in the body – not a generic multivitamin.'
    : 'Your box covers the everyday foundations that support overall health and prevention.';

  var bodyAim = bmiCat === 'healthy' ? 'the plan is about maintaining and fine-tuning at sensible doses'
    : (bmiCat === 'elevated' || bmiCat === 'high') ? B('omega-3') + ' and ' + B('magnesium') + ' get a little extra weight for metabolic and blood-pressure support'
    : bmiCat === 'underweight' ? 'fat-soluble nutrients are paired with a meal so you absorb more of them'
    : 'the plan stays at standard starting doses';
  var p2 = (age && bmiCat !== '–')
    ? 'At ' + B(age + ', ' + bmiCat + ' BMI') + ', ' + bodyAim + (age >= 50 ? ', and with age the body makes less ' + B('CoQ10') + ', so that earns its place too' : '') + '.'
    : '';

  var p3 = allConds.length
    ? 'Because you flagged ' + joinList(allConds.slice(0,3).map(function(c){ return B(c.toLowerCase()); })) + (allConds.length > 3 ? ' and more' : '') + ', your plan leans to gentler forms and more conservative doses, and flags anything worth a pharmacist’s review.'
    : '';

  var tip = (SUGG[primaryGoal] || {}).hack;
  var p4 = tip ? '<b style="color:#A98E4E">One habit that helps:</b> ' + esc(tip) : '';

  var reviewParasHtml = [p1, p2, p3, p4].filter(Boolean);
  var reviewHtml = reviewParasHtml.map(function(t){ return '<p style="margin:14px 12px 0 17px;font-size:15px;line-height:1.62;color:#33403A">' + t + '</p>'; }).join('');
  var review = reviewHtml.replace(/<[^>]+>/g, '');

  return {
    proto: proto, heroTitleHtml: heroTitleHtml, protoIcon: protoIcon, protoIconSm: protoIconSm,
    heroTitleLines: heroLines, heroSubtitle: heroSubtitle, heroSymbols: heroSymbols,
    summaryChips: summaryChips, review: review, reviewHtml: reviewHtml,
    age: age || '–', bmi: bmiV ? bmiV.toFixed(1) : '–', bmiCat: bmiCat,
    heightLabel: heightLabel, weightLabel: weightLabel,
    hasNutrition: kcal > 0,
    kcal: kcal || '–', protein: protein ? protein + 'g' : '–', fat: fat ? fat + 'g' : '–', carbs: carbs ? carbs + 'g' : '–',
    plan: plan, recNew: plan, box: box, optional: optional, subRestrictions: subRestrictions,
    directions: directions, notes: notes,
    status: R.status, action: R.action, verdicts: R.verdicts,
    viablePlans: R.viablePlans, deadPlans: R.deadPlans, deferReasons: R.deferReasons,
    pillCap: R.pillCap, band: R.band, adviceGroups: adviceGroups
  };
}

/* ---------- render: header ---------- */
function renderHeader(){
  var right = document.getElementById('hdrRight');
  var prog = document.getElementById('hdrProg');
  var showSteps = S.step >= 0 && S.step < 4;
  if(S.step === 4){
    right.innerHTML = '<button class="restart-btn" data-act="restart">Start over</button>';

  } else if(showSteps){
    right.innerHTML = '<span class="step-note">Step ' + (S.step + 1) + ' of 4</span>';
    prog.innerHTML = '<div class="prog-track"><div class="prog-fill" style="width:' + ((S.step + 1)/4)*100 + '%"></div></div>';
  } else {
    right.innerHTML = '';
    prog.innerHTML = '';
  }
}

/* ---------- render: quiz screens ---------- */
function chipHtml(label, on, act, arg){
  return '<button class="chip ' + (on ? 'on' : 'off') + '" data-act="' + act + '" data-arg="' + esc(arg) + '">' + esc(label) + '</button>';
}

// Combined first question: pick goals and, for each one selected, tap the
// specifics that apply — laid out like the old "What's going on specifically?".
function goalsScreen(){
  var atLimit = S.goals.length >= MAX_GOALS;
  var sections = GOALS.map(function(g){
    var on = S.goals.indexOf(g.id) !== -1;
    var locked = atLimit && !on;   // can't add a fourth
    var header = '<button data-act="toggle-goal" data-arg="' + g.id + '"' + (locked ? ' aria-disabled="true"' : '') + ' style="width:100%;display:flex;align-items:center;gap:11px;background:' + (on ? '#EAF3EE' : '#fff') + ';border:1.5px solid ' + (on ? '#14655B' : 'rgba(20,101,91,.15)') + ';border-radius:14px;padding:13px 15px;cursor:' + (locked ? 'default' : 'pointer') + ';text-align:left;font-family:inherit' + (locked ? ';opacity:.45' : '') + '">'
      + '<span class="goal-icon" style="flex:none">' + ic(g.paths, 20) + '</span>'
      + '<span style="flex:1;min-width:0;font-size:15px;font-weight:800;color:' + (on ? '#14655B' : '#1E3B34') + '">' + esc(g.title) + '</span>'
      + '<span class="goal-check" style="position:static;flex:none;border:2px solid ' + (on ? '#14655B' : '#C6CFC9') + ';background:' + (on ? '#14655B' : 'transparent') + '">' + (on ? '✓' : '') + '</span>'
      + '</button>';
    var chips = '';
    if(on){
      var opts = (CLAR[g.id]||[]).map(function(label){
        var val = g.id + '::' + label;
        return chipHtml(label, S.clarify.indexOf(val) !== -1, 'toggle-clarify', val);
      }).join('');
      chips = '<div style="display:flex;flex-wrap:wrap;gap:8px;margin:11px 4px 2px">' + opts + '</div>';
    }
    return '<div>' + header + chips + '</div>';
  }).join('');
  return '<div style="padding:28px 22px 0">'
    + '<div class="eyebrow">YOUR PERSONALISED PROTOCOL</div>'
    + '<h2 class="q-title">What would you like to improve?</h2>'
    + '<p class="q-sub" style="margin-bottom:4px">Choose up to three areas that matter most, then tap anything that sounds like you – skip whatever doesn’t apply.'
    + (atLimit ? ' <span style="font-weight:700;color:#14655B">That’s three — deselect one to change your choices.</span>' : '')
    + '</p>'
    + '<div style="display:flex;flex-direction:column;gap:14px;margin-top:20px">' + sections + '</div>'
    + '</div>';
}

function numInput(id, val, maxlen, placeholder, unit){
  return '<label class="num-box"><input type="text" inputmode="numeric" maxlength="' + maxlen + '" autocomplete="off" id="' + id + '" value="' + esc(val) + '" placeholder="' + placeholder + '">'
    + '<span class="num-unit">' + unit + '</span></label>';
}

function aboutScreen(){
  var sexBtns = [{id:'female',label:'Female'},{id:'male',label:'Male'}].map(function(x){
    return '<button class="seg-btn ' + (S.sex === x.id ? 'on' : 'off') + '" data-act="pick-sex" data-arg="' + x.id + '">' + x.label + '</button>';
  }).join('');
  var heightInputs = S.hUnit === 'ft'
    ? '<div style="display:flex;gap:10px">'
      + '<label class="num-box" style="flex:1;min-width:0;gap:6px;padding:14px 14px"><input type="text" inputmode="numeric" maxlength="1" autocomplete="off" id="inHFt" value="' + esc(S.hFt) + '" placeholder="–"><span class="num-unit">FT</span></label>'
      + '<label class="num-box" style="flex:1;min-width:0;gap:6px;padding:14px 14px"><input type="text" inputmode="numeric" maxlength="2" autocomplete="off" id="inHIn" value="' + esc(S.hIn) + '" placeholder="–"><span class="num-unit">IN</span></label>'
      + '</div>'
    : numInput('inHCm', S.hCm, 3, '–––', 'CM');
  return '<div style="padding:28px 22px 0">'
    + '<div class="eyebrow">ABOUT YOU</div>'
    + '<h2 class="q-title">A couple of basics</h2>'
    + '<p class="q-sub" style="margin-bottom:24px">Age, sex and body size change which nutrients and doses are right for you – for example iron, calcium, B12 and omega-3 needs.</p>'
    + '<div style="display:flex;flex-direction:column;gap:20px">'
    +   '<div><div class="field-label">AGE</div>' + numInput('inAge', S.age, 3, '––', 'YEARS') + '</div>'
    +   '<div><div class="field-label">BIOLOGICAL SEX</div><div style="display:flex;gap:8px">' + sexBtns + '</div></div>'
    +   '<div>'
    +     '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px"><div class="field-label" style="margin-bottom:0">WEIGHT</div>'
    +     '<div style="display:flex;gap:6px">'
    +       '<button class="unit-btn ' + (S.wUnit === 'lb' ? 'on' : 'off') + '" data-act="set-lb">lb</button>'
    +       '<button class="unit-btn ' + (S.wUnit === 'kg' ? 'on' : 'off') + '" data-act="set-kg">kg</button>'
    +     '</div></div>'
    +     numInput('inWeight', S.weight, 3, '––', S.wUnit === 'lb' ? 'LB' : 'KG')
    +   '</div>'
    +   '<div>'
    +     '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px"><div class="field-label" style="margin-bottom:0">HEIGHT</div>'
    +     '<div style="display:flex;gap:6px">'
    +       '<button class="unit-btn ' + (S.hUnit === 'ft' ? 'on' : 'off') + '" data-act="set-ft">ft / in</button>'
    +       '<button class="unit-btn ' + (S.hUnit === 'cm' ? 'on' : 'off') + '" data-act="set-cm">cm</button>'
    +     '</div></div>'
    +     heightInputs
    +   '</div>'
    + '</div></div>';
}

function suppsScreen(){
  var chips = SUPPS.concat(MEDS).map(function(l){ return chipHtml(l, S.supps.indexOf(l) !== -1, 'toggle-supp', l); })
    .concat(S.customSupps.map(function(l){ return chipHtml(l, true, 'toggle-customsupp', l); })).join('');
  return '<div style="padding:28px 22px 0">'
    + '<div class="eyebrow">YOUR ROUTINE</div>'
    + '<h2 class="q-title">Already taking any of these?</h2>'
    + '<p class="q-sub" style="margin-bottom:18px">Only the supplements and medications that overlap with your box or can interact with it – so we can flag anything worth checking. Skip anything you don’t take.</p>'
    + '<div style="display:flex;flex-wrap:wrap;gap:9px">' + chips + '</div>'
    + '<div class="add-row"><input type="text" id="inSuppDraft" value="' + esc(S.suppDraft) + '" placeholder="Add another…"><button data-act="add-supp">Add</button></div>'
    + '<p style="margin:16px 0 0;font-size:13px;color:#7A867E">None of these? Just continue – your box already contains everything your goals need.</p>'
    + '</div>';
}

function condScreen(){
  var pool = S.sex === 'male' ? CONDS.filter(function(c){ return c !== 'Pregnant or breastfeeding'; }) : CONDS;
  var chips = pool.map(function(l){ return chipHtml(l, S.conditions.indexOf(l) !== -1, 'toggle-cond', l); })
    .concat(S.customConditions.map(function(l){ return chipHtml(l, true, 'toggle-customcond', l); })).join('');
  return '<div style="padding:28px 22px 0">'
    + '<div class="eyebrow">YOUR HEALTH</div>'
    + '<h2 class="q-title">Anything we should know?</h2>'
    + '<p class="q-sub" style="margin-bottom:18px">This lets us avoid interactions and pick forms that suit your body – for example gentle formats if you have no gallbladder.</p>'
    + '<div style="display:flex;flex-wrap:wrap;gap:9px">' + chips + '</div>'
    + '<div class="add-row"><input type="text" id="inCondDraft" value="' + esc(S.condDraft) + '" placeholder="Add another…"><button data-act="add-cond">Add</button></div>'
    + '<p style="margin:14px 0 0;font-size:12.5px;line-height:1.5;color:#7A867E">Nothing applies? Just continue. This is an informational protocol, not medical advice – always check with your doctor.</p>'
    + '</div>';
}

function navHtml(){
  var valid = stepValid();
  var label = S.step === 3 ? 'See my protocol →' : (S.step === 0 ? 'Continue →' : 'Continue');
  return '<div class="nav"><div class="nav-row">'
    + (S.step > 0 ? '<button class="back-btn" data-act="back">←</button>' : '')
    + '<button class="next-btn" id="btnNext" data-act="next"' + (valid ? '' : ' disabled') + ' style="background:' + (valid ? '#14655B' : '#A9BAB3') + '">' + label + '</button>'
    + '</div></div>';
}

function syncNext(){
  var btn = document.getElementById('btnNext');
  if(!btn) return;
  var valid = stepValid();
  btn.disabled = !valid;
  btn.style.background = valid ? '#14655B' : '#A9BAB3';
}

/* ---------- render: finish screen ---------- */

/* Something they already take is part of their protocol but is not shipped
   unless they ask for it. The card carries the control; same pill shape as the
   "Edit" button on the pack, so nothing new is introduced to the page. */
function addToBoxControl(r){
  if(!r.alreadyTaking) return '';
  return r.inBox
    ? '<div style="margin-top:12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap">'
      +   '<button data-act="remove-from-box" data-arg="' + esc(r.id) + '" style="border:none;background:#14655B;color:#fff;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;cursor:pointer">✓ In your box</button>'
      +   '<span style="font-size:12.5px;color:#7A867E">Tap to take it back out.</span>'
      + '</div>'
    : '<div style="margin-top:12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap">'
      +   '<button data-act="add-to-box" data-arg="' + esc(r.id) + '" style="border:1.5px solid rgba(20,101,91,.3);background:#fff;color:#14655B;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;cursor:pointer">+ Add to box</button>'
      +   '<span style="font-size:12.5px;color:#7A867E">Not in your box – you already take it.</span>'
      + '</div>';
}

// noBoxControl: the pause screen has no purchase path, so nothing there is
// "in the box" — it shows the plan without the add/remove control.
function recCard(r, noBoxControl){
  // Name and the "already taking" badge share the left half of .rec-top, so the
  // row still has the two flex children its space-between layout expects.
  return '<div class="rec-card">'
    + '<div class="rec-top">'
    + '<span style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0">'
    +   '<span class="rec-name">' + esc(r.name) + '</span>'
    +   (r.alreadyTaking ? '<span class="plan-new">ALREADY TAKING</span>' : '')
    + '</span>'
    + (r.dosage ? '<span class="rec-time" style="color:#3A4A42;background:#EFE7D6">' + esc(r.dosage) + '</span>' : '')
    + '</div>'
    + (r.reason ? '<p class="rec-reason" style="font-weight:700;color:#14655B">' + esc(r.reason) + '</p>' : '')
    + ((r.effects || []).length
        ? '<p class="rec-reason">' + r.effects.map(esc).join(' ') + '</p>' : '')
    + (r.practical ? '<p class="rec-reason" style="color:#8A6D1F">' + esc(r.practical) + '</p>' : '')
    + (noBoxControl ? '' : addToBoxControl(r))
    + '</div>';
}

function planCol(items){
  /* A box needs at least BOX_MIN_SUPPS to be worth shipping, so the remove
     control disappears once the plan is down to the floor. */
  var canRemove = S.editPlan && items.length > BOX_MIN_SUPPS;
  return items.map(function(p){
    return '<div class="plan-item"><span class="plan-dot"></span><span class="plan-name">' + esc(p.name) + '</span>'
      + (p.alreadyTaking ? '<span class="plan-new">ALREADY TAKING</span>' : '')
      + (canRemove ? '<button data-act="remove-supp" data-arg="' + esc(p.name) + '" aria-label="Remove ' + esc(p.name) + '" style="margin-left:auto;flex:none;width:20px;height:20px;border:none;border-radius:50%;background:#E7D9D2;color:#9A5B4A;font-size:14px;font-weight:800;line-height:18px;text-align:center;cursor:pointer">×</button>' : '')
      + '</div>';
  }).join('');
}

function secHead(title){
  return '<div class="sec-head"><span class="sec-dot"></span><h3>' + title + '</h3></div>';
}

/* Advice for ticked sub-complaints. Sits below the plan, separate from the
   product content. Copy comes verbatim from data/complaint_advice.json. */
function adviceSection(R){
  if(!R.adviceGroups || !R.adviceGroups.length) return '';   // nothing ticked → omit entirely
  return secHead('Things that may help day to day')
    + '<div style="display:flex;flex-direction:column;gap:12px;margin-top:14px">'
    + R.adviceGroups.map(function(g){
        return '<div>'
          + '<div style="font-size:13px;font-weight:800;letter-spacing:.06em;color:#A98E4E">' + esc(g.goal) + '</div>'
          + g.items.map(function(a){
              return '<div style="background:#FFFDF8;border:1px solid rgba(20,101,91,.12);border-radius:14px;padding:13px 15px;margin-top:8px">'
                + '<div style="font-size:14.5px;font-weight:800;color:#1E3B34">' + esc(a.complaint) + '</div>'
                + '<p style="margin:4px 0 0;font-size:13.5px;line-height:1.55;color:#4A574F">' + esc(a.advice) + '</p></div>';
            }).join('')
          + '</div>';
      }).join('')
    + '</div>';
}

/* PAUSE — nothing worth selling. No price, no buy button, no checkout path. */
function pauseScreen(R){
  var why = (R.deferReasons && R.deferReasons.length)
    ? R.deferReasons.map(function(d){ return d.why; }).join(' ')
    : (R.action || '');
  var h = '<div>';
  h += '<div style="padding:30px 20px 26px;background:#F7F2E9">'
    + '<h2 style="font-family:\'Domine\',serif;font-weight:700;font-size:min(22px,5vw);line-height:1.2;margin:0;color:#1E3B34">Let’s pause here — please talk to your doctor first.</h2>'
    + '<p style="margin:11px 0 0;font-size:15px;line-height:1.55;color:#5A655D">' + esc(why) + '</p>'
    + '</div>';

  h += '<div style="padding:0 20px">';

  /* a real next action — email capture, no purchase path */
  if(!S.sent){
    var validEmail = /.+@.+\..+/.test(S.email);
    h += '<div style="margin-top:26px;background:#F7F2E9;border-radius:20px;padding:24px 20px">'
      + '<div style="font-family:\'Domine\',serif;font-weight:700;font-size:22px;color:#1E3B34">Email me when I’m ready</div>'
      + '<p style="margin:6px 0 16px;font-size:14px;line-height:1.5;color:#4A574F">We’ll save your plan and get in touch once your doctor has given you the go-ahead.</p>'
      + '<input type="email" id="inEmail" value="' + esc(S.email) + '" placeholder="you@example.com" style="width:100%;border:1.5px solid rgba(20,101,91,.25);border-radius:14px;padding:16px 18px;font-size:16px;background:#fff;color:#1E3B34">'
      + '<button id="btnEmail" data-act="submit-email"' + (validEmail ? '' : ' disabled') + ' style="width:100%;margin-top:12px;border:none;background:' + (validEmail ? '#14655B' : '#A9BAB3') + ';color:#fff;border-radius:14px;padding:17px;font-size:17px;font-weight:800;cursor:pointer">Save My Plan →</button>'
      + '</div>';
  } else {
    h += '<div style="margin-top:26px;background:#F7F2E9;border-radius:20px;padding:26px 20px;text-align:center">'
      + '<div style="width:52px;height:52px;border-radius:50%;background:#14655B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;margin:0 auto">✓</div>'
      + '<h3 style="font-family:\'Domine\',serif;font-weight:700;font-size:22px;margin:14px 0 6px;color:#1E3B34">Your plan is saved</h3>'
      + '<p style="margin:0 auto;max-width:290px;font-size:15px;line-height:1.55;color:#4A574F">We’ll reach out at <span style="font-weight:800;color:#14655B">' + esc(S.email) + '</span> when you’re ready to start.</p>'
      + '</div>';
  }

  /* their work isn't discarded — shown, de-emphasised, with no price */
  if(R.plan.length){
    h += secHead('What we’d put together for you')
      + '<div style="opacity:.55;display:flex;flex-direction:column;gap:10px;margin-top:14px">'
      + R.plan.map(function(p){ return recCard(p, true); }).join('')
      + '</div>';
  }

  h += adviceSection(R);
  h += pharmacistLine();
  h += '</div></div>';
  return h;
}

/* One plain line at the foot of the results page. */
function pharmacistLine(){
  return '<p style="margin:26px 0 10px;font-size:13px;line-height:1.6;color:#7A867E">'
    + 'These are supplements rather than medicine. If you take prescription medication, '
    + 'it’s worth running the list past your pharmacist.</p>';
}

function finishScreen(R){
  R = R || buildResults();
  if(R.status === 'pause') return pauseScreen(R);
  var h = '<div>';

  /* protocol lead — frameless header, left-aligned, with the protocol-direction symbols */
  h += '<div style="padding:30px 20px 26px;background:#F7F2E9">'
    + '<h2 style="font-family:\'Domine\',serif;font-weight:700;font-size:min(22px,5vw);white-space:nowrap;line-height:1.15;margin:0;color:#1E3B34;animation:heroIn .5s cubic-bezier(.2,.8,.2,1) both">Your daily supplement protocol</h2>'
    + '<p style="margin:11px 0 0;font-size:15px;line-height:1.5;color:#5A655D">' + esc(R.heroSubtitle) + '</p>'
    + (R.status === 'switch' && R.viablePlans.length && R.deadPlans.length
        ? '<p style="margin:10px 0 0;font-size:14.5px;line-height:1.55;color:#5A655D">Based on what you told us, we’ve focused your box on '
          + esc(R.viablePlans.join(' and ')) + ' — ' + esc(R.deadPlans.join(' and '))
          + ' needs ingredients that aren’t right for you at the moment.</p>'
        : '')
    + '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:18px">'
    +   R.heroSymbols.map(function(s){
          return '<span style="flex:none;display:inline-flex;align-items:center;gap:8px;background:#EFE7D6;border-radius:999px;padding:6px 13px 6px 7px;max-width:100%">'
            + '<span style="flex:none;width:28px;height:28px;border-radius:9px;background:#EAF3EE;display:flex;align-items:center;justify-content:center;color:#14655B">' + s.icon + '</span>'
            + '<span style="font-size:13px;font-weight:700;color:#1E3B34;white-space:nowrap">' + esc(s.title) + '</span></span>';
        }).join('')
    + '</div>'
    + '</div>';

  /* body content — inset from the page edges so headers, dots and cards aren't flush left */
  h += '<div style="padding:0 20px">';

  /* body metrics */
  h += secHead('Body metrics')
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">'
    + '<div class="metric-card"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="margin:0 0 6px;display:block"><circle cx="12" cy="8" r="3.4" stroke="#14655B" stroke-width="2"></circle><path d="M5.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5" stroke="#14655B" stroke-width="2" stroke-linecap="round"></path></svg>'
    + '<div class="metric-num">' + R.age + '</div><div class="metric-lbl">years old</div></div>'
    + '<div class="metric-card"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="margin:0 0 6px;display:block"><path d="M4 17a8 8 0 0 1 16 0" stroke="#14655B" stroke-width="2" stroke-linecap="round"></path><path d="M12 17l4.5-4.5" stroke="#14655B" stroke-width="2" stroke-linecap="round"></path></svg>'
    + '<div class="metric-num">' + R.bmi + '</div><div class="metric-lbl">BMI · ' + R.bmiCat + '</div></div>'
    + '<div class="metric-card"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="margin:0 0 6px;display:block"><path d="M12 4v16M8.5 7.5 12 4l3.5 3.5M8.5 16.5 12 20l3.5-3.5" stroke="#14655B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>'
    + '<div class="metric-num">' + R.heightLabel + '</div><div class="metric-lbl">height</div></div>'
    + '<div class="metric-card"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="margin:0 0 6px;display:block"><path d="M6 9h12l2 11H4L6 9Z" stroke="#14655B" stroke-width="2" stroke-linejoin="round"></path><path d="M9 9a3 3 0 0 1 6 0" stroke="#14655B" stroke-width="2"></path></svg>'
    + '<div class="metric-num">' + R.weightLabel + '</div><div class="metric-lbl">weight</div></div>'
    + '</div>'
    + R.reviewHtml;

  /* daily nutrition targets */
  if(R.hasNutrition){
    h += secHead('Daily nutrition targets')
      + '<p style="margin:10px 0 0;padding-left:17px;font-size:14px;line-height:1.5;color:#4A574F">An estimate from your age, sex and body size – a baseline to eat and dose around.</p>'
      + '<div style="margin-top:14px;background:#1E3B34;border-radius:18px;padding:20px 18px">'
      + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;text-align:left">'
      + '<div><div style="font-family:\'Domine\',serif;font-weight:700;font-size:23px;color:#F7F2E9">' + R.kcal + '</div><div style="font-size:11px;letter-spacing:.06em;color:#BFD8CF;margin-top:2px">KCAL</div></div>'
      + '<div><div style="font-family:\'Domine\',serif;font-weight:700;font-size:23px;color:#8FD6B4">' + R.protein + '</div><div style="font-size:11px;letter-spacing:.06em;color:#BFD8CF;margin-top:2px">PROTEIN</div></div>'
      + '<div><div style="font-family:\'Domine\',serif;font-weight:700;font-size:23px;color:#F0A560">' + R.fat + '</div><div style="font-size:11px;letter-spacing:.06em;color:#BFD8CF;margin-top:2px">FAT</div></div>'
      + '<div><div style="font-family:\'Domine\',serif;font-weight:700;font-size:23px;color:#9AB8F0">' + R.carbs + '</div><div style="font-size:11px;letter-spacing:.06em;color:#BFD8CF;margin-top:2px">CARBS</div></div>'
      + '</div></div>';
  }

  /* protocol direction */
  h += secHead('Protocol direction')
    + '<div style="display:flex;flex-direction:column;gap:12px;margin-top:16px">'
    + R.directions.map(function(d){
        return '<div style="background:#FFFDF8;border:1px solid rgba(20,101,91,.12);border-radius:16px;padding:18px">'
          + '<div style="display:flex;gap:14px;align-items:flex-start">'
          + '<div style="flex:none;width:44px;height:44px;border-radius:12px;background:#EAF3EE;display:flex;align-items:center;justify-content:center;color:#14655B">' + d.icon + '</div>'
          + '<div style="flex:1;min-width:0"><div style="font-size:16.5px;font-weight:800;color:#1E3B34">' + esc(d.goalTitle) + '</div>'
          + '<p style="margin:5px 0 0;font-size:14.5px;line-height:1.55;color:#4A574F">' + esc(d.text) + '</p></div></div>'
          + '<div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:12px">'
          + d.tags.map(function(t){ return '<span style="background:#EAF3EE;color:#14655B;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700">' + esc(t) + '</span>'; }).join('')
          + '</div>'
          + '<p style="margin:10px 0 0;font-size:14px;line-height:1.5;color:#4A574F"><span style="font-weight:800;color:#A98E4E">Try this:</span> ' + esc(d.hack) + '</p>'
          + '</div>';
      }).join('')
    + '</div>';

  /* your supplements — the whole protocol. Cards for actives they already take
     carry an "Add to box" control; only what is in the box gets shipped. */
  h += secHead('Your supplements')
    + '<p style="margin:12px 0 0;padding-left:17px;font-size:15px;line-height:1.55;color:#33403A"><span style="font-weight:800;color:#14655B">' + R.box.length + ' supplements</span> in one daily pack, chosen for your goals and profile.'
    + (R.optional.length
        ? ' You already take ' + (R.optional.length > 1 ? R.optional.length + ' more' : 'one more') + ' – add ' + (R.optional.length > 1 ? 'them' : 'it') + ' to your box below if you’d rather we supplied ' + (R.optional.length > 1 ? 'them' : 'it') + '.'
        : '')
    + '</p>'
    + '<div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">'
    + R.plan.map(function(p){ return recCard(p); }).join('') + '</div>';

  /* worth checking — user's own supplements that overlap or interact (flag only) */

/* ---------- the quiz → results transition ----------
   The rule: once the last question is answered the user always ends up
   somewhere. The step is persisted before anything that can fail runs, and
   every failure below routes forward — full plan, degraded plan, or an error
   screen with a retry. Being left on the last question is not a possible
   outcome any more. */

var RESULTS_INTERIM_MS = 500;     // show an interim state past this, not before
var formularyPromise = null;      // in-flight (or settled) /data load

function loadFormulary(){
  var files = ['ingredients','protocols','conditions','substitutions','viability','age_tuning','engine_config','complaint_advice','ingredient_effects'];
  return Promise.all(files.map(function(f){
    return fetch('data/' + f + '.json', { cache:'no-cache' }).then(function(r){
      if(!r.ok) throw new Error('data/' + f + '.json ' + r.status);
      return r.json();
    });
  })).then(function(loaded){
    var d = {}; files.forEach(function(f,i){ d[f] = loaded[i]; });
    applyFormularyData(d);
    return d;
  });
}

// Always asynchronous, so the interim timer below can fire on a slow phone —
// and so a fast device finishes well inside RESULTS_INTERIM_MS and never
// flashes a loading state. A failed load is not cached: a retry re-fetches.
function whenFormularyReady(cb){
  if(FORMULARY){ window.setTimeout(function(){ cb(null); }, 0); return; }
  if(!formularyPromise) formularyPromise = loadFormulary();
  formularyPromise.then(function(){ cb(null); }, function(err){
    formularyPromise = null;
    cb(err || new Error('formulary unavailable'));
  });
}

/* Interim and failure states, built from the classes already in this file —
   no new CSS, no new layout components.

   One place for the waiting copy so the three screens that use it can't drift:
   it says what is happening (their answers, being worked through) and roughly
   how long it takes, so a slow phone reads as "working", not "broken". */
var BUILDING_TITLE = 'Building your plan…';
var BUILDING_SUB   = 'We’re working through your answers — this takes a few seconds.';
var STARTING_TITLE = 'Getting your questions ready…';
var STARTING_SUB   = 'Just a moment.';

function buildingScreen(){ return interimScreen(BUILDING_TITLE, BUILDING_SUB); }

function interimScreen(title, sub){
  return '<div style="padding:28px 22px 0">'
    + '<div class="eyebrow">YOUR PERSONALISED PROTOCOL</div>'
    + '<h2 class="q-title">' + esc(title) + '</h2>'
    + '<p class="q-sub">' + esc(sub) + '</p>'
    + '</div>';
}

function retryScreen(title, sub){
  return '<div style="padding:28px 22px 0">'
    + '<div class="eyebrow">YOUR PERSONALISED PROTOCOL</div>'
    + '<h2 class="q-title">' + esc(title) + '</h2>'
    + '<p class="q-sub">' + esc(sub) + '</p>'
    + '<div class="nav"><div class="nav-row">'
    +   '<button class="next-btn" data-act="retry-results" style="background:#14655B">Try again</button>'
    + '</div></div>'
    + '</div>';
}

/* Degraded plan: when the full results page can't be built we still show the
   supplements we resolved, rather than an apology. Every field is guarded —
   one bad entry drops that row, not the page. */
function degradedScreen(R){
  var items = [];
  (R && R.plan ? R.plan : []).forEach(function(p){
    try{
      if(!p || !p.name) return;
      items.push('<div class="rec-card"><div class="rec-top">'
        + '<span style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0">'
        +   '<span class="rec-name">' + esc(p.name) + '</span>'
        +   (p.alreadyTaking ? '<span class="plan-new">ALREADY TAKING</span>' : '')
        + '</span>'
        + (p.dosage ? '<span class="rec-time" style="color:#3A4A42;background:#EFE7D6">' + esc(p.dosage) + '</span>' : '')
        + '</div></div>');
    }catch(e){}
  });
  return '<div><div style="padding:30px 20px 26px;background:#F7F2E9">'
    + '<h2 style="font-family:\'Domine\',serif;font-weight:700;font-size:min(22px,5vw);line-height:1.2;margin:0;color:#1E3B34">Your daily supplement protocol</h2>'
    + '<p style="margin:11px 0 0;font-size:15px;line-height:1.55;color:#5A655D">Here is your daily pack. We couldn’t load the rest of your protocol just now — try again for the full version.</p>'
    + '</div><div style="padding:0 20px">'
    + (items.length
        ? secHead('Your supplements') + '<div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">' + items.join('') + '</div>'
        : '')
    + '<div class="nav"><div class="nav-row">'
    +   '<button class="next-btn" data-act="retry-results" style="background:#14655B">Load the full protocol</button>'
    + '</div></div>'
    + pharmacistLine()
    + '</div></div>';
}

function paintScreen(html){
  var scr = document.getElementById('screen');
  if(!scr) return false;
  try{ renderHeader(); }catch(e){}
  scr.innerHTML = html;
  try{ bindScreenInputs(); }catch(e){}
  return true;
}

function paintResultsError(reason, err){
  try{ console.error('Welme: the results page did not render —', reason, err || ''); }catch(e){}
  trackResultsError(reason);
  paintScreen(retryScreen('We couldn’t finish your plan',
    'Your answers are saved. Try again — and if it keeps happening, get in touch and we’ll sort it out.'));
}

function paintDataError(err){
  try{ console.error('Welme: could not load the formulary —', err || ''); }catch(e){}
  trackResultsError('formulary_unavailable:' + ((err && err.message) || 'unknown'));
  paintScreen(retryScreen('We couldn’t load your plan',
    'Your answers are saved. Check your connection and try again.'));
}

/* The single entry point for the results page. Never throws. */
function renderResults(){
  var interim = window.setTimeout(function(){
    interim = null;
    paintScreen(buildingScreen());
  }, RESULTS_INTERIM_MS);

  var done = function(){ if(interim){ window.clearTimeout(interim); interim = null; } };

  try{
    whenFormularyReady(function(err){
      done();
      try{
        if(err){ paintDataError(err); return; }

        // Goals saved by a version of the quiz whose goal ids no longer exist:
        // there is nothing to resolve, so restart at the first question rather
        // than render an empty plan.
        var known = S.goals.filter(function(id){ return FORMULARY.protocols[id]; });
        if(S.goals.length && !known.length){
          trackResultsError('stale_goals:' + S.goals.join(','));
          set({ step: 0 });
          return;
        }

        var R = null, html = null, reason = '';
        try{ R = buildResults(); }
        catch(e){ reason = 'build:' + (e && e.message); }
        if(R){
          try{ html = finishScreen(R); }
          catch(e){ reason = 'render:' + (e && e.message); }
        }
        if(html && paintScreen(html)){ trackResultsView(''); return; }

        // The plan resolved but the page didn't: show the plan anyway.
        if(R){
          try{
            if(paintScreen(degradedScreen(R))){
              trackResultsError(reason);
              trackResultsView('degraded');
              return;
            }
          }catch(e){ reason = 'degraded:' + (e && e.message); }
        }
        paintResultsError(reason || 'unknown', null);
      }catch(e){
        paintResultsError('transition:' + (e && e.message), e);
      }
    });
  }catch(e){
    done();
    paintResultsError('transition_start:' + (e && e.message), e);
  }
}

// Called when the user answers the last question.
function goToResults(){
  quizFinishAt = nowMs();
  resultsViewTracked = false;
  try{ trackQuizFinish(); }catch(e){}
  setQuiet({ step: 4 });            // past the questions, whatever happens next
  try{ window.scrollTo(0,0); }catch(e){}
  renderResults();
}

function retryResults(){
  resultsViewTracked = false;
  paintScreen(buildingScreen());
  whenFormularyReady(function(err){
    if(err){ paintDataError(err); return; }
    try{ render(); }
    catch(e){ paintResultsError('retry:' + (e && e.message), e); }
  });
}

/* Records the lead. Two different buttons reach this — the pause screen's
   "email me when I'm ready" and the results page's "continue to purchase" —
   so it is guarded to fire once. Returns whether it recorded anything. */
function recordLead(){
  if(S.emailSubmitTracked) return false;
  var validEmail = /.+@.+\..+/.test(S.email);
  if(!validEmail) return false;
  try{ localStorage.setItem('welmeUserEmail', S.email); }catch(e){}
  var R = buildResults();
  try{ if(window.fbq) fbq('track', 'Lead'); }catch(e){}
  try{ if(window.gtag) gtag('event', 'generate_lead'); }catch(e){}
  S.emailSubmitTracked = true;
  persist();
  if(trackingAvailable()){
    window.WelmeTracking.trackEvent({
      page:'results',
      event:'email_submit',
      email:S.email,
      results:buildReadableResultsSummary(R)
    }, { keepalive:true });
  }
  /* Anonymous per-campaign count, separate sheet, no id and no email. */
  try{
    if(window.WelmeTracking && window.WelmeTracking.trackAdConversion){
      window.WelmeTracking.trackAdConversion();
    }
  }catch(e){}
  return true;
}
