# Serve the home page at the root URL. The forced 200 rewrite shows
# home.html while keeping "/", taking precedence over index.html.
[[redirects]]
  from = "/"
  to = "/home.html"
  status = 200
  force = true

# Clean URLs
[[redirects]]
  from = "/home"
  to = "/home.html"
  status = 200

[[redirects]]
  from = "/protocol"
  to = "/protocol.html"
  status = 200

# Canonical order URL. Netlify already serves order00014012.html for the
# extensionless path, so this only needs to send the .html form to it —
# otherwise whichever URL was clicked is the one that stays in the address bar.
[[redirects]]
  from = "/order00014012.html"
  to = "/order00014012"
  status = 301

# Legacy paths → new ones (301 permanent)
[[redirects]]
  from = "/landing"
  to = "/home"
  status = 301

[[redirects]]
  from = "/landing.html"
  to = "/home"
  status = 301

[[redirects]]
  from = "/ad-funnel"
  to = "/protocol"
  status = 301

[[redirects]]
  from = "/ad-funnel.html"
  to = "/protocol"
  status = 301
