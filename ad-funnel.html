function getUserId(){
  var userId = localStorage.getItem('welme_user_id');
  if(!userId){

function trackEvent(eventType, extra){
  extra = extra || {};
  try{ if(window.fbq) fbq('trackCustom', eventType); }catch(e){}
  try{ if(window.gtag) gtag('event', eventType); }catch(e){}
  if(!WELME_TRACKING_URL) return;
  try{
    var payload = {
      timestamp: new Date().toISOString(),
      user_id: getUserId(),
      event_type: eventType,
      age: S.age || '',
      gender: S.sex || '',
      protocol: extra.protocol != null ? extra.protocol : (S.goals[0] || ''),
      stack: extra.stack != null ? extra.stack : S.goals.join(', '),
      checkout_click: false
    };
    if(Array.isArray(payload.stack)) payload.stack = payload.stack.join(', ');
    console.log('WELME TRACKING WEBHOOK PAYLOAD', JSON.stringify(payload));
    if(location.hostname === '127.0.0.1' || location.hostname === 'localhost') return;
    var body = JSON.stringify(payload);
    var sent = false;
    if(navigator.sendBeacon){
      try{ sent = navigator.sendBeacon(WELME_TRACKING_URL, new Blob([body], {type:'text/plain;charset=UTF-8'})); }
      catch(e){ sent = false; }
    }
    if(!sent){
      fetch(WELME_TRACKING_URL, {method:'POST', mode:'no-cors', keepalive:true,
        headers:{'Content-Type':'text/plain;charset=UTF-8'}, body:body});
    }

}

  var kg = parseFloat(S.weight); if(!kg) return null;
  if(S.wUnit === 'lb') kg = kg * 0.4536;
  var cm = S.hUnit === 'cm' ? (parseFloat(S.hCm)||0) : ((parseFloat(S.hFt)||0)*12 + (parseFloat(S.hIn)||0))*2.54;
  if(cm < 90) return null;
  var m = cm/100;
  return kg/(m*m);
}

function stepValid(){
  var age = parseInt(S.age)||0;
  var wv = parseFloat(S.weight)||0;
  var hOk = S.hUnit === 'cm' ? (parseFloat(S.hCm)||0) >= 90 : (parseFloat(S.hFt)||0) >= 3;
  var checks = [
    S.goals.length > 0,
    true,
    (age >= 16 && age <= 110 && !!S.sex && wv > 0 && hOk),
    true, true
  ];
  return S.step < checks.length ? checks[S.step] : true;
}

function toggleIn(key, val){
  var list = S[key];
  var next = list.indexOf(val) !== -1 ? list.filter(function(x){ return x !== val; }) : list.concat(val);
  var patch = {}; patch[key] = next;
  set(patch);
}

function addChip(listKey, draftKey){
  var v = (S[draftKey]||'').trim();
  if(!v) return;
  var patch = {};
  if(S[listKey].indexOf(v) !== -1){ patch[draftKey] = ''; set(patch); return; }
  patch[listKey] = S[listKey].concat(v);
  patch[draftKey] = '';
  set(patch);
}

/* linked imperial/metric switch – toggling weight OR height switches BOTH systems and converts values */
function toImperial(){
  var patch = { wUnit:'lb', hUnit:'ft' };
  if(S.wUnit === 'kg'){ var kg = parseFloat(S.weight); if(kg) patch.weight = String(Math.round(kg/0.4536)); }
  if(S.hUnit === 'cm'){ var cm = parseFloat(S.hCm); if(cm){ var t = cm/2.54, f = Math.floor(t/12), i = Math.round(t - f*12); if(i === 12){ f += 1; i = 0; } patch.hFt = String(f); patch.hIn = String(i); } }
  set(patch);
}
function toMetric(){
  var patch = { wUnit:'kg', hUnit:'cm' };
  if(S.wUnit === 'lb'){ var lb = parseFloat(S.weight); if(lb) patch.weight = String(Math.round(lb*0.4536)); }
  if(S.hUnit === 'ft'){ var f = parseFloat(S.hFt)||0, i = parseFloat(S.hIn)||0; if(f || i) patch.hCm = String(Math.round((f*12 + i)*2.54)); }
  set(patch);
}

/* ---------- recommendation engine ---------- */
function buildResults(){
  var age = parseInt(S.age)||0;
  var wv = parseFloat(S.weight)||0;
  var bmiV = bmi();
  var bmiCat = bmiV == null ? '–' : bmiV < 18.5 ? 'underweight' : bmiV < 25 ? 'healthy' : bmiV < 30 ? 'elevated' : 'high';
  var heightLabel = S.hUnit === 'cm'
    ? ((parseFloat(S.hCm)||0) ? Math.round(parseFloat(S.hCm)) + ' cm' : '–')
    : ((parseFloat(S.hFt)||0) ? (parseFloat(S.hFt)||0) + '′' + (parseFloat(S.hIn)||0) + '″' : '–');
  var weightLabel = wv ? S.weight + ' ' + S.wUnit : '–';

  /* daily nutrition targets (Mifflin-St Jeor estimate) */
  var kgT = wv; if(S.wUnit === 'lb') kgT = kgT*0.4536;
  var cmT = S.hUnit === 'cm' ? (parseFloat(S.hCm)||0) : ((parseFloat(S.hFt)||0)*12 + (parseFloat(S.hIn)||0))*2.54;
  var kcal = 0, protein = 0, fat = 0, carbs = 0;
  if(kgT > 0 && cmT >= 90 && age > 0){
    var sexAdj = S.sex === 'female' ? -161 : 5;
    var bmr = 10*kgT + 6.25*cmT - 5*age + sexAdj;
    kcal = Math.round(bmr*1.4/10)*10;
    protein = Math.round(kgT*1.2);
    fat = Math.round(kcal*0.30/9);
    carbs = Math.round((kcal - protein*4 - fat*9)/4);
  }

  /* protocol identity (from primary goal) */
  var primaryGoal = S.goals[0];
  var proto = PROTOCOL[primaryGoal] || {title:'Your Protocol', sub:'A plan built around your answers'};
  var primaryG = null;
  GOALS.forEach(function(g){ if(g.id === primaryGoal) primaryG = g; });
  var protoIcon = primaryG ? ic(primaryG.paths, 116, 1.5) : '';
  /* hero title: selected goal names in the order they were picked, one per line */
  var heroLines = S.goals.map(function(id){
    var found = null;
    GOALS.forEach(function(g){ if(g.id === id) found = g; });
    return found ? found.title : null;
  }).filter(Boolean);
  if(!heroLines.length) heroLines = [proto.title];
  var heroTitleHtml = heroLines.map(function(t){ return esc(t); }).join('<br>');

  /* review copy */
  var selGoals = GOALS.filter(function(g){ return S.goals.indexOf(g.id) !== -1; });
  var goalTitlesLower = selGoals.map(function(g){ return g.title.toLowerCase(); });
  var allConds = S.conditions.concat(S.customConditions);
  var review = 'At ' + (age||'–') + ', with a BMI of ' + (bmiV ? bmiV.toFixed(1) : '–') + ' (' + bmiCat + '), your profile is a solid starting point. ';
  if(bmiCat === 'healthy') review += 'Your body metrics sit in the healthy range, so the focus is maintaining them. ';
  else if(bmiCat === 'elevated' || bmiCat === 'high') review += 'Your BMI is above the healthy range, which adds cardiovascular and joint load – steady daily habits matter most. ';
  else if(bmiCat === 'underweight') review += 'Your BMI is below the healthy range, so adequate nutrient intake is a priority. ';
  review += goalTitlesLower.length ? 'Your protocol targets ' + goalTitlesLower.slice(0,3).join(', ') + (goalTitlesLower.length > 3 ? ' and more' : '') + '.' : 'Your protocol focuses on prevention and daily balance.';

  var summaryChips = selGoals.map(function(g){ return g.title; });
  if(age) summaryChips.push(age + ' yrs');
  if(bmiV) summaryChips.push('BMI ' + bmiV.toFixed(1));

  /* recommendation set (5–8 supplements) */
  var ordered = [];
  var pushRec = function(n){ if(CATALOG[n] && ordered.indexOf(n) === -1) ordered.push(n); };
  S.goals.forEach(function(g){ (GOAL_SUPPS[g]||[]).forEach(pushRec); });
  S.clarify.forEach(function(v){ if(CLAR_SUPPS[v]) pushRec(CLAR_SUPPS[v]); });
  if(age >= 50){ pushRec('Vitamin B12'); pushRec('Vitamin D3'); }
  if(age >= 60){ pushRec('CoQ10'); }
  if(S.sex === 'female' && age > 0 && age < 50) pushRec('Iron');
  if(S.sex === 'female' && age >= 45) pushRec('Calcium');
  if(bmiV && bmiV >= 27){ pushRec('Omega-3'); pushRec('Berberine'); }
  if(allConds.indexOf('Iron-deficiency anemia') !== -1){ pushRec('Iron'); pushRec('Vitamin C'); }
  if(allConds.indexOf('Pregnant or breastfeeding') !== -1) pushRec('Folate');
  ['Vitamin D3','Omega-3','Magnesium','Multivitamin'].forEach(function(n){ if(ordered.length < 5) pushRec(n); });
  ordered = ordered.slice(0,8);

  var norm = function(str){ return String(str).toLowerCase().replace(/\s*\/.*/,'').replace(/[^a-z0-9]/g,''); };
  var userSupps = S.supps.concat(S.customSupps);
  var userNorm = userSupps.map(norm);
  var userHas = function(n){ return userNorm.indexOf(norm(n)) !== -1; };
  var timeMeta = function(time){ return {
    timeLabel: time === 'm' ? 'MORNING' : 'NIGHT',
    timeBg: time === 'm' ? '#F0E7CF' : '#E4EEF0',
    timeColor: time === 'm' ? '#8A6D1F' : '#3C5A66'
  }; };
  var protocol = ordered.map(function(n){
    var info = CATALOG[n];
    return Object.assign({ name:n, reason:info.reason, time:info.time, isNew:!userHas(n) }, timeMeta(info.time));
  });

  /* integrate the user's current supplements that aren't already in the recommended set */
  var CANON = {}; Object.keys(CATALOG).forEach(function(k){ CANON[norm(k)] = k; });
  var orderedNorm = ordered.map(norm);
  var seenExtra = {};
  var takeExtra = userSupps.filter(function(n){
    var k = norm(n);
    if(orderedNorm.indexOf(k) !== -1 || seenExtra[k]) return false;
    seenExtra[k] = 1; return true;
  }).map(function(n){
    var canon = CANON[norm(n)];
    var info = canon ? CATALOG[canon] : null;
    var time = info ? info.time : 'm';
    return Object.assign({
      name: canon || n,
      reason: info ? info.reason : 'Kept from your current routine and slotted into your daily schedule.',
      time: time, isNew: false
    }, timeMeta(time));
  });
  var fullProtocol = protocol.concat(takeExtra);

  /* protocol direction (lifestyle "try this" tips per goal) */
  var directions = selGoals.map(function(g){
    var d = SUGG[g.id]; if(!d) return null;
    return { goalTitle:g.title, text:d.text, hack:d.hack, tags:(GOAL_SUPPS[g.id]||[]), icon:ic(g.paths, 23) };
  }).filter(Boolean);

  var notes = allConds.map(function(c){ return NOTE[c]; }).filter(Boolean);

  return {
    proto: proto, heroTitleHtml: heroTitleHtml, protoIcon: protoIcon,
    summaryChips: summaryChips, review: review,
    age: age || '–', bmi: bmiV ? bmiV.toFixed(1) : '–', bmiCat: bmiCat,
    heightLabel: heightLabel, weightLabel: weightLabel,
    hasNutrition: kcal > 0,
    kcal: kcal || '–', protein: protein ? protein + 'g' : '–', fat: fat ? fat + 'g' : '–', carbs: carbs ? carbs + 'g' : '–',
    fullProtocol: fullProtocol,
    recNew: protocol.filter(function(p){ return p.isNew; }),
    recTake: fullProtocol.filter(function(p){ return !p.isNew; }),
    planMorning: fullProtocol.filter(function(p){ return p.time === 'm'; }),
    planNight: fullProtocol.filter(function(p){ return p.time === 'n'; }),
    directions: directions, notes: notes
  };
}

    + '<div class="how-step"><span class="how-num">1</span><p>Your box arrives with 28 daily packs – four weeks of your plan.</p></div>'

/* ---------- email submit ---------- */
function submitEmail(){
  var validEmail = /.+@.+\..+/.test(S.email);
  if(!validEmail) return;
  try{ localStorage.setItem('welmeUserEmail', S.email); }catch(e){}
  var R = buildResults();
  var stack = R.fullProtocol.map(function(p){ return p.name; });
  if(WELME_SHEET_URL){
    try{
      var payload = { user_id: getUserId(), email: S.email, protocol: R.proto.title, stack: stack.join(', ') };
      console.log('WELME EMAIL WEBHOOK PAYLOAD', payload);
      if(location.hostname !== '127.0.0.1' && location.hostname !== 'localhost'){
        fetch(WELME_SHEET_URL, {method:'POST', mode:'no-cors',
          headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
      }
    }catch(e){}
  }
  try{ if(window.fbq) fbq('track', 'Lead'); }catch(e){}
  try{ if(window.gtag) gtag('event', 'generate_lead'); }catch(e){}
  trackEvent('email_submitted', { protocol: R.proto.title, stack: stack });
  set({ sent: true });
}

/* ---------- render root ---------- */
function bindInput(id, key, filter, after){
  var el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', function(){
    var v = filter ? filter(el.value) : el.value;
    if(v !== el.value) el.value = v;
    S[key] = v; persist();
    if(after) after();
  });
}

var lastRenderedStep = null;
function render(){
  renderHeader();
  var screen = document.getElementById('screen');
  var html = '';
  if(S.step === 0) html = goalsScreen();
  else if(S.step === 1) html = clarifyScreen();
  else if(S.step === 2) html = aboutScreen();
  else if(S.step === 3) html = suppsScreen();
  else if(S.step === 4) html = condScreen();
  else html = finishScreen();
  if(S.step < 5) html += navHtml();
  screen.innerHTML = html;
  /* replay the enter animation only when the step changes */
  if(lastRenderedStep !== S.step){
    lastRenderedStep = S.step;
    screen.style.animation = 'none';
    void screen.offsetWidth;
    screen.style.animation = '';
  }

  bindInput('inAge', 'age', num, syncNext);
  bindInput('inWeight', 'weight', num, syncNext);
  bindInput('inHFt', 'hFt', num, syncNext);
  bindInput('inHIn', 'hIn', num, syncNext);
  bindInput('inHCm', 'hCm', num, syncNext);
  bindInput('inSuppDraft', 'suppDraft', null);
  bindInput('inCondDraft', 'condDraft', null);
  bindInput('inEmail', 'email', null, function(){
    var btn = document.getElementById('btnEmail');
    if(!btn) return;
    var ok = /.+@.+\..+/.test(S.email);
    btn.disabled = !ok;
    btn.style.background = ok ? '#14655B' : '#A9BAB3';
  });

  var suppDraft = document.getElementById('inSuppDraft');
  if(suppDraft) suppDraft.addEventListener('keydown', function(e){ if(e.key === 'Enter') addChip('customSupps','suppDraft'); });
  var condDraft = document.getElementById('inCondDraft');
  if(condDraft) condDraft.addEventListener('keydown', function(e){ if(e.key === 'Enter') addChip('customConditions','condDraft'); });
}

document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!t) return;
  var act = t.getAttribute('data-act');
  var arg = t.getAttribute('data-arg');
  switch(act){
    case 'toggle-goal': toggleIn('goals', arg); break;
    case 'toggle-clarify': toggleIn('clarify', arg); break;
    case 'toggle-supp': toggleIn('supps', arg); break;
    case 'toggle-customsupp': toggleIn('customSupps', arg); break;
    case 'toggle-cond': toggleIn('conditions', arg); break;
    case 'toggle-customcond': toggleIn('customConditions', arg); break;
    case 'pick-sex': set({sex: arg}); break;
    case 'set-lb': if(S.wUnit !== 'lb') toImperial(); break;
    case 'set-kg': if(S.wUnit !== 'kg') toMetric(); break;
    case 'set-ft': if(S.hUnit !== 'ft') toImperial(); break;
    case 'set-cm': if(S.hUnit !== 'cm') toMetric(); break;
    case 'add-supp': addChip('customSupps','suppDraft'); break;
    case 'add-cond': addChip('customConditions','condDraft'); break;
    case 'back':
      if(S.step > 0){ set({step: S.step - 1}); window.scrollTo(0,0); }
      break;
    case 'next':
      if(stepValid()){
        var next = S.step + 1;
        set({step: next});
        window.scrollTo(0,0);
        trackEvent(next === 5 ? 'protocol_viewed' : 'funnel_step_' + next);
      }
      break;
    case 'submit-email': submitEmail(); break;
    case 'restart':
      set({ step:0, goals:[], clarify:[], age:'', sex:'',
        weight:'', wUnit:'lb', hUnit:'ft', hFt:'', hIn:'', hCm:'', supps:[], customSupps:[],
        suppDraft:'', conditions:[], customConditions:[], condDraft:'', email:'', sent:false });
      window.scrollTo(0,0);
      break;
  }
});

render();
</script>
